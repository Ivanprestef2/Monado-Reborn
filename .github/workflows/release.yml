# Release packages for Linux and Windows, built in CI. They hold NO game code and NO game files (Constitution art. I):
# the runtime is built with CMake -DMONADO_RELEASE=ON and the launcher builds the game code once, on the player's PC,
# from their own dump (tools/gamebuild/gamebuild.py, frozen with PyInstaller and bundled with a trimmed zig). Every package tree
# is checked with tools/package/package_guard.py before it is uploaded.
#
# Run it by hand (Actions > release > Run workflow) for test packages, or push a tag v* for a DRAFT GitHub release with
# both packages attached: review it on the Releases page and publish it yourself.
# Manual run + a tag name in the "tag" box = a DRAFT release is created too.
#
# Package names carry the version being released: Monado-<version>-x86_64.AppImage and
# Monado-Windows-x64-<version>.zip. The version comes from the v* tag (v1.2.3 -> 1.2.3) or from the manual "tag"
# input; a manual run without a tag uses 0.0.0-dev.<run>-<sha> so test packages still have unique names.
#
# Upscalers: FSR 1 always; FSR 3 (Linux: native component built from AMD's SDK source; Windows: AMD's signed DLL from
# the official FidelityFX SDK 1.1.4 release); DLSS on Windows (NVIDIA's official Streamline release,
# tools/package/install_dlss.py, hash-pinned) and Linux (NVIDIA NGX, tools/package/setup_linux_dlss.py, hash-pinned);
# FSR 4: on Linux, amd_fidelityfx_upscaler_vk.so built from auz466/fsr4up-vk (MIT, embeds AMD's MIT SDK 2.4.0 shaders
# and weights directly — FP8 default on RDNA 4, FSR 4 Lite INT8 default on RDNA 2/3 & Intel Arc); on Windows, AMD's
# signed amd_fidelityfx_upscaler_vk.dll from FidelityFX SDK 2.4.0 (MIT, hash-pinned and Authenticode-verified). No
# on-PC preparation step on either platform.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag (e.g. v0.0.0-test). Leave empty to only build packages.'
        required: false
        type: string
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  ZIG_VERSION: '0.17.1'
  SDL_TAG: release-3.4.8
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
  APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
  FFX_URL: https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/releases/download/v1.1.4/FidelityFX-SDK-v1.1.4.zip
  FFX_SHA256: 0216556bfb0e243cec30004a2a98d38f4e3f7406cb7938e3c1b85c758e95d952   # (AMD publishes no digest: measured once)
  FFX4_DLL_URL: https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_vk.dll
  FFX4_DLL_SHA256: 4a7e895af6e0b615d40a84d59eb8c2b1054ad91cdd0c739567940270d51bdab7
  FFX4_LICENSE_URL: https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/v2.4.0/Kits/FidelityFX/docs/license.md

jobs:
  version:
    # One place decides the package-name suffix, so Linux and Windows cannot drift apart.
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the package version
        id: resolve
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            ref="$REF_NAME"
          else
            ref="$TAG_INPUT"
          fi
          version="${ref#v}"
          if [ -z "$version" ]; then
            version="0.0.0-dev.${RUN}-${SHA:0:7}"
          fi
          # keep only filename-safe characters: letters, digits, dot, underscore, dash
          version=$(printf '%s' "$version" | tr -c 'A-Za-z0-9._-' '-')
          version=$(printf '%s' "$version" | sed -e 's/^-\+//' -e 's/-\+$//')
          if [ -z "$version" ]; then
            echo "::error::could not derive a filename-safe version from '$ref'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

  pgo:
    # The committed profile (data/pgo/monado.proftext.gz, docs/guides/PGO.md) is LLVM's text format. A compiler reads only an
    # indexed profile from its own LLVM version or an older one, so convert it once with the oldest compiler that
    # reads it: clang-19 (the Linux runtime). zig 0.17.1's clang 22 (the Windows runtime and every player's game code
    # build) reads that too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Index the profile with LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm-19
          python3 tools/build/pgo.py check
          python3 tools/build/pgo.py index --tool llvm-profdata-19 --out build/pgo/monado.profdata
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-profile
          path: build/pgo/monado.profdata
          if-no-files-found: error

  linux:
    needs: [version, pgo]
    runs-on: ubuntu-24.04   # (glibc 2.39: the AppImage then runs on current and older distributions alike)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 lld-19 ninja-build cmake pkg-config git glslang-tools \
            nasm libvulkan-dev libshaderc-dev libopus-dev zlib1g-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev libfuse2t64 file
      - name: SDL3 (not packaged by Ubuntu 24.04; the same version as the Windows build)
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
                -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/SDL/build
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig
      - name: Vulkan headers (Ubuntu 24.04's 1.3.275 lack extensions the renderer uses)
        run: |
          git clone --depth 1 --branch v1.4.366 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vkh
          cmake -S /tmp/vkh -B /tmp/vkh/build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/vkh/build
      - name: Vulkan Memory Allocator header
        run: |
          mkdir -p build/deps
          curl -fsSL -o build/deps/vk_mem_alloc.h \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.3.0/include/vk_mem_alloc.h
      - name: FFmpeg 9.0.2 - minimal LGPL (VP9 + Vorbis from WebM, no GPL codec libraries)
        # The distro's libavcodec is a full build: it pulls every codec and its external libraries into the AppImage.
        # The runtime only decodes the 14 VP9 + Vorbis cutscenes (runtime/hle/movie.c), so build that subset instead.
        run: |
          sudo bash scripts/build_ffmpeg.sh --prefix /usr/local
          sudo ldconfig
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tools (recompiler, zig, PyInstaller)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -q "ziglang==$ZIG_VERSION" capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5 pyinstaller
      - uses: actions/download-artifact@v4
        with:
          name: pgo-profile
          path: build/pgo
      - name: Stage the first-start builder
        run: .venv/bin/python tools/gamebuild/gamebuild_stage.py --dest build/gamebuild --platform linux --pgo build/pgo/monado.profdata
      - name: Build the release runtime, launcher and upscaler components
        env:
          VMA_INCLUDE_DIR: ${{ github.workspace }}/build/deps
          PYTHON: .venv/bin/python
          CC: clang-19
          CXX: clang++-19
        run: |
          .venv/bin/python tools/package/setup_linux_dlss.py
          # clang 19+: runtime/platform/linux.c checks __builtin_cpu_supports("cx16")
          cmake --preset linux -B build/cmake/release -DMONADO_RELEASE=ON "-DMONADO_VERSION=${{ needs.version.outputs.version }}" -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DMONADO_PGO=build/pgo/monado.profdata
          cmake --build build/cmake/release
          test -f build/linux/libmonado_fsr3.so || { echo "::error::native FSR 3 was not built"; exit 1; }
          test -f build/linux/amd_fidelityfx_upscaler_vk.so || { echo "::error::native FSR 4 (fsr4up-vk) was not built"; exit 1; }
          test -f build/linux/libmonado_dlss.so || { echo "::error::native Linux DLSS was not built"; exit 1; }
          test -f build/linux/libnvidia-ngx-dlss.so.310.9.1 || { echo "::error::Linux DLSS runtime was not staged"; exit 1; }
      - name: Freeze the builder
        run: .venv/bin/python tools/gamebuild/freeze_gamebuild.py --python .venv/bin/python
      - name: appimagetool (pinned)
        run: |
          curl -fsSL -o /tmp/appimagetool "$APPIMAGETOOL_URL"
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
      - name: Package the AppImage (checked with tools/package/package_guard.py)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          img="Monado-${VERSION}-x86_64.AppImage"
          python3 tools/package/make_appimage.py --release --appimagetool /tmp/appimagetool --output "dist/$img"
          (cd dist && sha256sum "$img" > "$img.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: monado-linux-${{ needs.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  windows:
    needs: [version, pgo]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2   # the runner's own MSYS2 in C:\msys64, where the build expects the UCRT64 libraries
        with:
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-vulkan-memory-allocator mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-zlib mingw-w64-ucrt-x86_64-gcc
            make nasm diffutils curl tar
      # Build-time caches (each step below is only rebuilt when its own inputs change): FFmpeg, the patched unicorn
      # and the FSR 4 Lite preparation tool are pinned, so their outputs are cached by the hash of what builds them;
      # zig's compiler cache is restored from the newest run, so unchanged C/C++ files are not compiled again.
      - name: Restore FFmpeg
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\msys64\opt\ffmpeg-min
          key: ffmpeg-windows-${{ hashFiles('scripts/build_ffmpeg.sh') }}-v1
      - name: FFmpeg 9.0.2 - minimal LGPL (VP9 + Vorbis from WebM, no GPL codec libraries)
        # The MSYS2 ffmpeg package is a full build: its import tables pull 99 DLLs (137 MB) into the ZIP. The runtime
        # only decodes the 14 VP9 + Vorbis cutscenes (runtime/hle/movie.c), so build that subset instead.
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh --prefix /opt/ffmpeg-min
      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\msys64\opt\ffmpeg-min
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - name: Install FFmpeg into UCRT64
        shell: msys2 {0}
        run: cp -r /opt/ffmpeg-min/. /ucrt64/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tools (recompiler, zig, CMake, Ninja, PyInstaller)
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -q "ziglang==$env:ZIG_VERSION" capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5 cmake ninja pyinstaller zstandard
      - name: Restore the patched unicorn
        id: unicorn-cache
        uses: actions/cache/restore@v4
        with:
          path: build/unicorn
          key: unicorn-windows-${{ hashFiles('tools/build/build_unicorn.py', 'tools/unicorn/*.patch') }}-v1
      - name: unicorn 2.1.4 with the Windows code buffer committed up front (GitHub #104)
        # The frozen builder ships this library instead of the wheel's: tools/build/build_unicorn.py says why. --check
        # emulates one instruction with faulthandler on and fails on any fault.
        run: |
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          $skip = if ('${{ steps.unicorn-cache.outputs.cache-hit }}' -eq 'true') { '--skip-build' } else { $null }
          .venv\Scripts\python tools/build/build_unicorn.py --install --check $skip
      - name: Save the patched unicorn
        if: steps.unicorn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/unicorn
          key: ${{ steps.unicorn-cache.outputs.cache-primary-key }}
      - name: Restore the zig cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\zig
          key: zig-windows-${{ env.ZIG_VERSION }}-${{ github.run_id }}
          restore-keys: zig-windows-${{ env.ZIG_VERSION }}-
      - name: AMD FSR 3 (SDK 1.1.4), AMD FSR 4 (SDK 2.4.0) and NVIDIA DLSS (Streamline, hash-pinned)
        run: |
          Invoke-WebRequest -Uri $env:FFX_URL -OutFile ffx.zip
          $hash = (Get-FileHash ffx.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFX_SHA256) { throw "FidelityFX SDK zip: sha256 $hash, expected $env:FFX_SHA256" }
          $dll = (tar -tf ffx.zip | Select-String 'PrebuiltSignedDLL/amd_fidelityfx_vk.dll$' | Select-Object -First 1).ToString()
          tar -xf ffx.zip $dll
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item $dll build/amd_fidelityfx_vk.dll
          $sig = Get-AuthenticodeSignature build/amd_fidelityfx_vk.dll
          "amd_fidelityfx_vk.dll signature: $($sig.Status) ($($sig.SignerCertificate.Subject))"
          if ($sig.Status -ne 'Valid') { throw 'amd_fidelityfx_vk.dll is not validly signed' }
          Remove-Item ffx.zip
          Invoke-WebRequest -Uri $env:FFX4_DLL_URL -OutFile build/amd_fidelityfx_upscaler_vk.dll
          $h4 = (Get-FileHash build/amd_fidelityfx_upscaler_vk.dll -Algorithm SHA256).Hash.ToLower()
          if ($h4 -ne $env:FFX4_DLL_SHA256) { throw "amd_fidelityfx_upscaler_vk.dll: sha256 $h4, expected $env:FFX4_DLL_SHA256" }
          $sig4 = Get-AuthenticodeSignature build/amd_fidelityfx_upscaler_vk.dll
          "amd_fidelityfx_upscaler_vk.dll signature: $($sig4.Status) ($($sig4.SignerCertificate.Subject))"
          if ($sig4.Status -ne 'Valid') { throw 'amd_fidelityfx_upscaler_vk.dll is not validly signed' }
          Invoke-WebRequest -Uri $env:FFX4_LICENSE_URL -OutFile build/fsr4-LICENSE-AMD-SDK.md
          .venv\Scripts\python tools/package/install_dlss.py
      - uses: actions/download-artifact@v4
        with:
          name: pgo-profile
          path: build/pgo
      - name: Restore zig's C runtime for the game code library
        id: prelink-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\zig-prelink
          key: prelink-windows-${{ env.ZIG_VERSION }}-${{ hashFiles('tools/gamebuild/gamebuild_stage.py', 'tools/build/game_id.py') }}-v1
      - name: Stage the first-start builder (with the executable's import library)
        env:
          MONADO_PRELINK_CACHE: ${{ runner.temp }}\zig-prelink
        run: .venv\Scripts\python tools/gamebuild/gamebuild_stage.py --dest build/gamebuild --platform windows --link-file xcde_imports.a --pgo build/pgo/monado.profdata
      - name: Save zig's C runtime for the game code library
        if: steps.prelink-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\zig-prelink
          key: ${{ steps.prelink-cache.outputs.cache-primary-key }}
      - name: Build the release runtime and launcher
        run: |
          $env:PATH = "$PWD\.venv\Scripts;C:\msys64\ucrt64\bin;$env:PATH"
          cmake --preset windows -B build/cmake/release -DMONADO_RELEASE=ON "-DMONADO_VERSION=${{ needs.version.outputs.version }}" "-DMONADO_PGO=build/pgo/monado.profdata"
          cmake --build build/cmake/release
          foreach ($f in 'build/xcde.exe', 'build/xcde_launcher.exe', 'build/amd_fidelityfx_upscaler_vk.dll', 'build/gamebuild/xcde_imports.a') {
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
      - name: Freeze the builder
        run: .venv\Scripts\python tools/gamebuild/freeze_gamebuild.py --python .venv\Scripts\python.exe
      - name: Package the ZIP (checked with tools/package/package_guard.py)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          .venv\Scripts\python tools/package/make_portable.py "$env:RUNNER_TEMP\Monado-Windows" --release --msys C:\msys64\ucrt64\bin
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "Monado-Windows-x64-$env:VERSION.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP\Monado-Windows\*" -DestinationPath "dist/$zip"
          (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower() + "  $zip" |
            Out-File -Encoding ascii "dist/$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: monado-windows-${{ needs.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release (review and publish it on the Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes "Built by the release workflow from ${GITHUB_SHA::7}. No game code or game files: the launcher builds the game code once from your own dump (Xenoblade Chronicles: Definitive Edition 2.0.0)." \
            dist/*
