name: ci
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # no game data and no upstream trees are needed for these tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (no game data)
        run: python -X utf8 -W error::ResourceWarning -m unittest discover -s tests/unit -v
      - name: Documentation links and paths
        run: python -X utf8 tools/check_docs.py
      - name: Repo path literals in build, CI and tooling files
        if: runner.os == 'Linux'
        run: python -X utf8 tools/check_paths.py
      - name: Packaging guard over tracked files (Constitution art. I)
        run: python -X utf8 tools/package/package_guard.py --git .
  windows-components:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Project-local compiler and test dependencies (no game data)
        run: python -m pip install --target build/toolchain ziglang==0.17.1 capstone==5.0.9 lz4==4.4.5 unicorn==2.1.4
      - name: Official project-local validation SDK
        run: python tools/diag/setup_validation.py
      - name: Windows runtime components, launcher and native regressions
        run: python tools/diag/validate_port.py --build-ui
  linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang-19
      SDL_TAG: release-3.4.8
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install native test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build pkg-config libvulkan-dev libvulkan-memory-allocator-dev libshaderc-dev
      - name: Build SDL3 for the platform tests
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3" -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_STATIC=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build "$RUNNER_TEMP/SDL/build"
          cmake --install "$RUNNER_TEMP/SDL/build"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/sdl3/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sdl3/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Run Linux native tests (no game data)
        env:
          MONADO_REQUIRE_NATIVE_DEPS: '1'
        run: bash scripts/native_tests_linux.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Differential SIMD tests against Unicorn (no game data)
        run: |
          python -m pip install capstone==5.0.9 unicorn==2.1.4 lz4==4.4.5
          python tools/lifter/tests/test_simd.py --encodings 2000 --cases 4 --no-validity --jobs 4 --cflags=-march=x86-64-v2
